name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase db start
      - name: Migrations apply cleanly from zero
        run: supabase db reset
      - name: RLS policy tests
        run: supabase test db

  static-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          NEXT_PUBLIC_ENABLE_PREVIEW: "true"
      - name: Service role key must never reach client bundles
        run: |
          if grep -rl "SUPABASE_SERVICE_ROLE_KEY\|RAZORPAY_KEY_SECRET" apps/web/.next/static; then
            echo "Server secret name found in client bundle"; exit 1
          fi

  e2e:
    needs: [database, static-and-unit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: pnpm install --frozen-lockfile
      - run: supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector
      - name: Local env from the CLI stack (demo keys, never real secrets)
        run: |
          eval "$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_APP_URL=http://localhost:3100"
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "SUPABASE_JWT_SECRET=$JWT_SECRET"
            echo "GUEST_SESSION_SECRET=$(openssl rand -hex 32)"
            echo "RAZORPAY_WEBHOOK_SECRET=local-only-webhook-secret-for-tests"
          } > apps/web/.env.local
      - run: pnpm build
        env:
          NEXT_PUBLIC_ENABLE_PREVIEW: "true"
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          CI: "true"
          NEXT_PUBLIC_ENABLE_PREVIEW: "true"
          PAYMENTS_FAKE: "true"
